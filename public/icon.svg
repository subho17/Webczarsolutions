<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16171b" />
      <stop offset="100%" stop-color="#090a0c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c8e5" />
      <stop offset="100%" stop-color="#0096ad" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00c8e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2a2c34" stroke-width="4" />

  <!-- Iconic Webczar monogram -->
  <g filter="url(#subtleGlow)">
    <!-- Left half of W (Crisp White) -->
    <path
      d="M 112 144 L 188 368 L 256 220"
      fill="none"
      stroke="url(#whiteGrad)"
      stroke-width="56"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Right half of W (Vibrant Brand Cyan) -->
    <path
      d="M 256 220 L 324 368 L 400 144"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="56"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Center interlocking accent node -->
    <circle cx="256" cy="220" r="16" fill="#00e5ff" />
  </g>
</svg>
